name: Build and Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            javafx_platform: linux
            asset_name: JetFileTransfer-linux-x64
            package_path: JetFileTransfer
            archive_ext: tar.gz
            icon_path: packaging/app-512.png
            jpackage_type: app-image
          - os: macos-latest
            javafx_platform: mac-aarch64
            asset_name: JetFileTransfer-macos-aarch64
            archive_ext: dmg
            icon_path: packaging/app.icns
            jpackage_type: dmg
          - os: windows-latest
            javafx_platform: win
            asset_name: JetFileTransfer-windows-x64
            package_path: JetFileTransfer
            archive_ext: zip
            icon_path: packaging/app.ico
            jpackage_type: app-image

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Verify app icons
        shell: bash
        run: |
          test -f packaging/app.icns
          test -f packaging/app.ico
          test -f packaging/app-512.png
          test -f src/main/resources/images/app.png

      - name: Build with Maven
        shell: bash
        run: mvn -B clean package -Djavafx.platform=${{ matrix.javafx_platform }}

      - name: Prepare distribution input
        shell: bash
        run: |
          mkdir -p target/app-input target/javafx-lib
          cp target/JetFileTransfer.jar target/app-input/
          cp target/lib/gson-*.jar target/lib/jfoenix-*.jar target/lib/commons-io-*.jar target/lib/TrayNotification-*.jar target/app-input/
          cp target/lib/javafx-*.jar target/javafx-lib/

      - name: Package application (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          rm -rf target/dist
          JPACKAGE_ARGS=(
            --type app-image
            --input target/app-input
            --dest target/dist
            --name JetFileTransfer
            --app-version "${{ github.run_number }}"
            --main-jar JetFileTransfer.jar
            --main-class com.mycompany.filetransferwithui.MainApp
            --icon "${{ matrix.icon_path }}"
            --module-path target/javafx-lib
            --add-modules javafx.controls,javafx.fxml,javafx.graphics,javafx.base,ALL-DEFAULT
            --java-options "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED"
            --java-options "--add-opens=java.base/java.lang=ALL-UNNAMED"
            --java-options "--add-opens=java.base/java.text=ALL-UNNAMED"
            --java-options "--add-opens=java.desktop/java.awt.font=ALL-UNNAMED"
            --java-options "--add-opens=java.desktop/com.apple.eawt=ALL-UNNAMED"
          )
          jpackage "${JPACKAGE_ARGS[@]}"

      - name: Package application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path target/dist) { Remove-Item -Recurse -Force target/dist }
          jpackage `
            --type app-image `
            --input target/app-input `
            --dest target/dist `
            --name JetFileTransfer `
            --app-version "${{ github.run_number }}" `
            --main-jar JetFileTransfer.jar `
            --main-class com.mycompany.filetransferwithui.MainApp `
            --icon "${{ matrix.icon_path }}" `
            --module-path target/javafx-lib `
            --add-modules javafx.controls,javafx.fxml,javafx.graphics,javafx.base,ALL-DEFAULT `
            --java-options "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED" `
            --java-options "--add-opens=java.base/java.lang=ALL-UNNAMED" `
            --java-options "--add-opens=java.base/java.text=ALL-UNNAMED" `
            --java-options "--add-opens=java.desktop/java.awt.font=ALL-UNNAMED" `
            --java-options "--add-opens=java.desktop/com.apple.eawt=ALL-UNNAMED"

      - name: Sign macOS app bundle
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          APP="target/dist/JetFileTransfer.app"

          if [ -n "${APPLE_CERTIFICATE}" ] && [ -n "${APPLE_SIGNING_IDENTITY}" ]; then
            echo "Signing with Apple Developer ID..."
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p actions build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p actions build.keychain
            security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
            codesign --force --deep --options runtime \
              --entitlements packaging/macos/entitlements.plist \
              --sign "$APPLE_SIGNING_IDENTITY" \
              "$APP"

            if [ -n "${APPLE_ID}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD}" ] && [ -n "${APPLE_TEAM_ID}" ]; then
              echo "Notarizing app..."
              ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/JetFileTransfer-notarize.zip"
              xcrun notarytool submit "$RUNNER_TEMP/JetFileTransfer-notarize.zip" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --wait
              xcrun stapler staple "$APP"
            fi
          else
            echo "Using ad-hoc signature..."
            codesign --force --deep --sign - "$APP"
          fi

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rm -f target/dist/*.dmg
          jpackage --type dmg \
            --app-image target/dist/JetFileTransfer.app \
            --dest target/dist \
            --name JetFileTransfer \
            --app-version "${{ github.run_number }}"
          shopt -s nullglob
          DMG_FILES=(target/dist/*.dmg)
          if [ ${#DMG_FILES[@]} -eq 0 ]; then
            echo "No DMG file was created. Contents of target/dist:"
            ls -la target/dist/
            exit 1
          fi
          mv "${DMG_FILES[0]}" "target/${{ matrix.asset_name }}.dmg"

      - name: Create archive (Linux)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          cd target/dist
          tar -czf "../${{ matrix.asset_name }}.tar.gz" "${{ matrix.package_path }}"


      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/dist/${{ matrix.package_path }}" -DestinationPath "target/${{ matrix.asset_name }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.asset_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          tag_name: release-${{ github.run_number }}
          name: Release ${{ github.run_number }} (${{ github.sha }})
          generate_release_notes: true
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
